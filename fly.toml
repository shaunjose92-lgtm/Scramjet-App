# Australian hosting: "syd" is Fly.io's Sydney datacenter region.
# This controls where the server runs and the network used for site requests.
# Locale-only changes would NOT make sites see an Australian IP.
primary_region = "syd"
kill_signal = "SIGTERM"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  TZ = "Australia/Sydney"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health/ready"
    timeout = "5s"
