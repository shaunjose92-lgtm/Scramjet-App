<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2620">
<title>Where to? · Cipher Browser</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%227%22 fill=%22%237a8a62%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap">
<style>
:root{
  --bg:#2a2620;--bg-2:#1f1c17;--card:rgba(237,229,212,.06);--line:#3a342c;
  --text:#ede5d4;--dim:#a39a8a;--faint:#7a7264;--sage:#97a67d;--soft:rgba(151,166,125,.18);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:linear(0,.0545,.1864,.3553,.5312,.6938,.8311,.9379,1.0139,1.0621,1.0872,1.0948,1.09,1.0778,1.0618,1.0452,1.0297,1.0165,1.0063,.9989,.9943,.9918,.991,.9923,.9945,.9969,.9989,1);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#f4f1e9;--bg-2:#ede5d4;--card:rgba(43,38,32,.05);--line:#e3dcc9;--text:#2b2620;--dim:#6a6358;--faint:#9a948a;--sage:#7a8a62;--soft:rgba(122,138,98,.18)}
}
:root[data-theme="light"]{--bg:#f4f1e9;--bg-2:#ede5d4;--card:rgba(43,38,32,.05);--line:#e3dcc9;--text:#2b2620;--dim:#6a6358;--faint:#9a948a;--sage:#7a8a62;--soft:rgba(122,138,98,.18)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(70% 55% at 50% 0,var(--soft),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg-2));background-attachment:fixed;
  color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.hero{text-align:center;max-width:520px}
.hero h1{margin:0;font:600 clamp(32px,7vw,46px)/1.08 var(--display);letter-spacing:-.02em}
.hero p{margin:10px 0 0;font-size:14.5px;color:var(--dim)}
form{width:100%;max-width:560px;margin:0}
.bar{display:flex;align-items:center;gap:10px;height:52px;padding:0 7px 0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  transition:border-color .25s,box-shadow .3s,transform .4s var(--ease)}
.bar:focus-within{border-color:var(--sage);box-shadow:0 0 0 4px var(--soft);transform:translateY(-1px)}
.bar svg{flex:none;color:var(--faint)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;font:500 16px var(--sans)}
#q::placeholder{color:var(--faint)}
#go{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--sage);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .4s var(--spring)}
#go:hover{transform:scale(1.1)}#go:active{transform:scale(.88)}
.sites{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.site{display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px 4px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);
  color:inherit;font:500 12.5px var(--sans);text-decoration:none;cursor:pointer;transition:transform .55s var(--spring),border-color .25s,box-shadow .3s}
.site:hover{transform:translateY(-4px);border-color:var(--sage);box-shadow:0 16px 26px -20px #000}
.site:active{transform:scale(.94);transition-duration:.15s}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:700 20px var(--display);transition:transform .5s var(--spring)}
.site:hover .ico{transform:scale(1.1) rotate(-5deg)}
.ico svg{width:24px;height:24px}
.note{max-width:440px;margin:0;text-align:center;font-size:11.5px;line-height:1.55;color:var(--faint)}
#loading{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:linear-gradient(180deg,var(--bg),var(--bg-2));opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#loading.on{opacity:1;visibility:visible;transition:opacity .3s}
.sp{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sage);animation:spin .8s linear infinite}
#loading small{display:block;margin-top:6px;color:var(--faint);font-size:12.5px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.hero,form,.site,.note{animation:rise .75s calc(.05s + var(--i,0)*55ms) var(--ease) backwards}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
@media(max-width:560px){.sites{gap:9px}.site{padding:12px 2px 10px;font-size:11.5px;border-radius:18px}.ico{width:42px;height:42px;border-radius:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="hero" style="--i:0"><h1>Where to?</h1><p>Search the web or jump into a site, right inside Cipher.</p></div>

<form id="f" style="--i:1" autocomplete="off">
  <div class="bar">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search or type a web address" aria-label="Search or type a web address">
    <button id="go" type="submit" aria-label="Go"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</form>

<div class="sites" id="sites"></div>
<p class="note" style="--i:11">Pages open through Cipher's own proxy. The first load can take up to a minute while it wakes up. Don't enter passwords you can't afford to lose.</p>

<div id="loading" role="status"><span class="sp"></span><div><span id="ltx">Opening…</span><small>The first load can take up to a minute.</small></div></div>

<script>
(function () {
  // Where the proxy lives. Same-origin when this file is hosted next to the proxy, otherwise the Render URL.
  var PROXY = /onrender\.com$/.test(location.hostname) ? location.origin + '/' : 'https://scramjet-app-bx7d.onrender.com/';
  var SEARCH = 'https://www.google.com/search?q=';

  // Optional ?theme=light|dark so Cipher can match its own theme.
  var t = new URLSearchParams(location.search).get('theme');
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);

  var SITES = [
    ['Instagram', 'https://www.instagram.com/', 'linear-gradient(45deg,#f9ce34,#ee2a7b 55%,#6228d7)', '#fff', '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6"/>'],
    ['Snapchat', 'https://www.snapchat.com/', '#fffc00', '#111', '<path d="M12 3c-3 0-5 2.2-5 5v3.2c-.6.5-1.2.8-2 1 .8.9 1.7 1.2 2.6 1.3-.3.9-1 1.5-2 1.9 1.6.4 2.6.8 3.4 1.8.5.6 1.2 1 3 1s2.5-.4 3-1c.8-1 1.8-1.4 3.4-1.8-1-.4-1.7-1-2-1.9.9-.1 1.8-.4 2.6-1.3-.8-.2-1.4-.5-2-1V8c0-2.8-2-5-5-5Z"/>'],
    ['TikTok', 'https://www.tiktok.com/', '#111', '#fff', '<path d="M10 17.5V6l9-2v11.5"/><circle cx="7" cy="17.5" r="3"/><circle cx="16" cy="15.5" r="3"/>'],
    ['YouTube', 'https://www.youtube.com/', '#e62117', '#fff', '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="m10 9.5 5 2.5-5 2.5Z" fill="currentColor"/>'],
    ['Google', 'https://www.google.com/', '#fff', '#4285f4', null, 'G'],
    ['Wikipedia', 'https://www.wikipedia.org/', '#f2f2f2', '#222', null, 'W'],
    ['Reddit', 'https://www.reddit.com/', '#ff4500', '#fff', null, 'r/'],
    ['Discord', 'https://discord.com/app', '#5865f2', '#fff', '<path d="M8.5 7.5c2.3-.9 4.7-.9 7 0 1.6 2.4 2.3 4.8 2.2 7.2-1 .8-2.2 1.3-3.4 1.6l-.8-1.3c-1.2.3-2.3.3-3.4 0l-.8 1.3c-1.2-.3-2.4-.8-3.4-1.6-.1-2.4.6-4.8 2.2-7.2Z"/><circle cx="9.8" cy="12" r=".9" fill="currentColor"/><circle cx="14.2" cy="12" r=".9" fill="currentColor"/>']
  ];
  var box = document.getElementById('sites');
  SITES.forEach(function (s, i) {
    var a = document.createElement('a');
    a.className = 'site'; a.href = link(s[1]); a.style.setProperty('--i', i + 2);
    a.setAttribute('data-url', s[1]);
    a.innerHTML = '<span class="ico" style="background:' + s[2] + ';color:' + s[3] + '">' +
      (s[4] ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + s[4] + '</svg>' : s[5]) +
      '</span><span>' + s[0] + '</span>';
    box.appendChild(a);
  });

  function link(u) { return PROXY + '?go=' + encodeURIComponent(u); }
  function normalize(q) {
    q = (q || '').trim(); if (!q) return '';
    if (/^https?:\/\//i.test(q)) return q;
    if (!/\s/.test(q) && /^[\w-]+(\.[\w-]+)+(:\d+)?([\/?#].*)?$/.test(q)) return 'https://' + q;
    return SEARCH + encodeURIComponent(q);
  }
  function go(url) {
    if (!url) return;
    document.getElementById('loading').classList.add('on');
    location.href = link(url);   // navigates this frame, so Cipher just shows the proxied page
  }

  box.addEventListener('click', function (e) {
    var a = e.target.closest('.site'); if (!a) return;
    e.preventDefault(); go(a.getAttribute('data-url'));
  });
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault(); go(normalize(document.getElementById('q').value));
  });
  // Coming back with the back button: hide the loader again.
  window.addEventListener('pageshow', function () { document.getElementById('loading').classList.remove('on'); });
  if (window.matchMedia('(pointer:fine)').matches && window.top === window) document.getElementById('q').focus();
})();
</script>
</body>
</html>
