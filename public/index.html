<style>

<script>
const $=i=>document.getElementById(i),api=(p,o={})=>fetch("/api/"+p,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...o}),J=b=>({method:"POST",body:JSON.stringify(b)});

 const ok=v=>v?"✓":"✗";let srv=false,ms=0;try{const a=Date.now();srv=(await api("me")).status<500;ms=Date.now()-a}catch{}

 l(ok(!!ctl)+" Browser engine");l(ok(!!(navigator.serviceWorker&&navigator.serviceWorker.controller))+" Service worker");l(ok(srv)+" Cipher server"+(srv?" ("+ms+" ms)":""));l("… Waiting on "+(L.t?host(L.t.url):"site"))}

 $("ldM").textContent="Something got in the way. Here’s what the Cipher server told us.";const d=$("ldD");d.style.display="block";d.innerHTML="";const c=document.createElement("code");c.textContent=short(m,400);d.append(c)}

 if(/SSL|certificate|error code 35|TLS/i.test(msg)&&t.q!=null&&t.ei<ENG.length-1){t.ei++;go(t,ENG[t.ei]+encodeURIComponent(t.q),1);return}
 if(L.t===t){L.err=msg;const w=60000-(Date.now()-L.start);if(w<=0)showErr(t,msg);else{L.timers.forEach(clearTimeout);L.timers=[setTimeout(()=>{$("ldM").textContent=M1},Math.max(0,45000-(Date.now()-L.start))),setTimeout(()=>showErr(t,msg),w)]}}

$("ldB1").onclick=hideLd;$("ldB2").onclick=()=>{const r=L.retry;hideLd();r&&r()};

}catch(e){ready=null;showErr({title:"Cipher Browser"},"Engine error: "+(e&&e.message||e),()=>location.reload());throw e}})()}
/* ---- tabs ---- */
const bmOf=u=>bms.find(b=>b.url===u);

 tabs.forEach((x,i)=>{const d=document.createElement("div");d.className="tab"+(i==cur?" on":"");const s=document.createElement("span");s.textContent=x.title||"New tab";const c=document.createElement("b");c.textContent="×";c.title="Close tab";c.onclick=e=>{e.stopPropagation();closeTab(i)};d.append(s,c);d.onclick=()=>activate(i);$("tabs").append(d);x.f.classList.toggle("on",i==cur)});
 const p=document.createElement("div");p.className="tab add";p.textContent="+";p.title="New tab";p.onclick=()=>openTab("");$("tabs").append(p);
 if(document.activeElement!==$("url"))$("url").value=t?t.url:"";$("bm").textContent=t&&t.url&&bmOf(t.url)?"★":"☆"}
const save=()=>api("tabs",{method:"PUT",body:JSON.stringify({tabs:tabs.filter(t=>t.url).map(t=>({url:t.url,title:t.title}))})}).catch(()=>{});
function activate(i){cur=i;const t=tabs[i];if(t&&t.pend){const u=t.pend;t.pend=null;go(t,u,1)}draw()}

async function openTab(u,title,lazy){try{await boot()}catch{return}
 const fe=document.createElement("iframe");fe.setAttribute("allow","fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; accelerometer; gyroscope; microphone; camera; midi; encrypted-media; picture-in-picture; web-share");

 const pl=[];try{pl.push(new $scramjetUtils.UrlWatcherPlugin(x=>{const h=String(x);if(t.armed&&h&&h!==t.url){t.url=h;$("pbar").style.width="70%";draw();save()}}))}catch{}

 try{const w=t.f.contentWindow;if(w.location.href==="about:blank")return;const d=t.f.contentDocument,x=((d.body&&d.body.innerText)||"").trim();

/* ---- controls ---- */
document.querySelectorAll(".tile").forEach(x=>x.onclick=()=>submit(x.dataset.u));
$("sq").onkeydown=e=>{if(e.key=="Enter"){submit(e.target.value);e.target.value=""}};
$("url").onkeydown=e=>{if(e.key=="Enter")submit(e.target.value)};$("url").onfocus=e=>e.target.select();

  const z=document.createElement("button");z.textContent="×";z.title="Remove";z.onclick=async()=>{await api("data/"+k+"?id="+x.id,{method:"DELETE"});if(k=="bookmarks"){await loadBms();draw()}d.remove()};d.append(a,z);s.append(d)});
